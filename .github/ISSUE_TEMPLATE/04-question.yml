name: ❓ Question
description: Ask a question about usage, behavior, or design.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        If this repository has Discussions enabled, prefer its Discussions tab
        for open-ended questions. Use this form for a focused question about
        this project.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched the README, docs, and existing issues.
          required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Share any code, commands, or links that show what you've already explored.
