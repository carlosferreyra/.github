name: ✨ Feature request
description: Suggest a new feature or enhancement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: ["carlosferreyra"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe **the problem
        you're trying to solve** before jumping to a specific solution.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I have searched existing issues and discussions for similar requests.
          required: true
        - label: This request is in scope for this project.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
      placeholder: I'm always frustrated when …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you'd like. Mockups, API sketches, and pseudo-code welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you've thought about.

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would make my life easier
        - Blocking my use case
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, related issues, or screenshots.
