title: "[Q]: "
body:
  - type: markdown
    attributes:
      value: |
        Got a question? Please search existing discussions and issues first.
        The more specific the question, the better the answer.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to accomplish? What have you already tried?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment (if relevant)
      description: Versions, OS, runtime, etc.
