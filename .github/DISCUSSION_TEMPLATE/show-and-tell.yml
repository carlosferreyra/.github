title: "[Show & Tell]: "
labels: ["show-and-tell"]
body:
  - type: markdown
    attributes:
      value: |
        Built something cool with one of these projects? Share it here!

  - type: input
    id: project
    attributes:
      label: What did you build?
      placeholder: A short, descriptive title.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Tell us about it
      description: What does it do? Who is it for? What was tricky?
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Link
      description: Live demo, source repo, blog post, video, etc.

  - type: textarea
    id: feedback
    attributes:
      label: Feedback or questions
      description: Anything you'd like input on?
